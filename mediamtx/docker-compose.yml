version: "3.9"

services:
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: zikrekidusan-mediamtx
    restart: unless-stopped
    ports:
      # WHIP / WebRTC HTTP signaling (proxy TLS :443 -> 127.0.0.1:8889)
      - "8889:8889/tcp"
      # WebRTC ICE media transport (MUST be open publicly on firewall!)
      - "8189:8189/udp"
      - "8189:8189/tcp"
      # RTSP internal (loopback FFmpeg -> RTMP relay)
      - "127.0.0.1:8554:8554"
      # Control REST API (expose via authenticated HTTPS reverse proxy or firewall allowlist)
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      - MTX_LOGLEVEL=info
      # Required on VPS/cloud NAT: set to your VPS public IP or mtx.zikrekidusan.com
      - MTX_WEBRTCADDITIONALHOSTS=${MTX_WEBRTCADDITIONALHOSTS:-}
    # Health check — requires MediaMTX v1.8+
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9997/v3/config/global/get"]
      interval: 15s
      timeout: 5s
      retries: 3