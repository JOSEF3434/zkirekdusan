version: "3.9"

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: zikrekidusan-mediamtx
    restart: unless-stopped
    ports:
      # WHIP / WebRTC endpoint (browser connects here)
      - "8889:8889/tcp"
      - "8889:8889/udp"
      # RTSP internal (ffmpeg re-publish)
      - "8554:8554"
      # API / health
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      - MTX_LOGLEVEL=info
    # Health check — requires MediaMTX v1.8+
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9997/v3/config/global/get"]
      interval: 15s
      timeout: 5s
      retries: 3