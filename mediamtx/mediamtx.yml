###############################################################################
# MediaMTX — Zikre Kedusan WebRTC-to-RTMP Ingest Gateway
#
# Role: Accept WebRTC streams from browser via WHIP, re-stream to Cloudinary.
# WHIP endpoint: POST https://<host>/<path>/whip
#
# DEPLOYMENT NOTE:
#   WebRTC requires direct UDP/TCP ICE connectivity on :8189 in addition to
#   HTTP/WHIP signaling on :8889 and Control API :9997 for the NestJS backend.
#   Render Web Services only proxy HTTP(S) on 80/443 and drop custom ports and
#   UDP packets, so deploy MediaMTX on a Docker VPS (DigitalOcean, Hetzner, EC2)
#   while keeping the NestJS backend on Render.
###############################################################################

logLevel: info
logDestinations: [stdout]

# REST API — used for health checks and dynamic path management by the backend.
# On a public VPS, restrict :9997 via firewall/VPN or reverse proxy with auth
# (and set MEDIAMTX_API_USER / MEDIAMTX_API_PASSWORD in the backend).
api: yes
apiAddress: :9997

# RTSP — MediaMTX exposes each WHIP session internally on localhost so FFmpeg
# can pull from rtsp://127.0.0.1:8554/<path> over TCP and push FLV to Cloudinary.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# Disable RTMP server-side ingest (ffmpeg pushes to Cloudinary as RTMP client)
rtmp: no

# Disable HLS (Cloudinary provides HLS output)
hls: no

# ─── WebRTC / WHIP ───────────────────────────────────────────────────────────
webrtc: yes
# HTTP/WHIP signaling port (reverse-proxied over HTTPS on :443)
webrtcAddress: :8889
# WebRTC ICE media transport listeners (MUST be opened on VPS firewall & Docker!)
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcAllowOrigins: ["*"]

# Set MTX_WEBRTCADDITIONALHOSTS=<public-vps-ip-or-domain> in docker-compose env
# so ICE host candidates advertise the reachable public address behind NAT/Docker.
webrtcAdditionalHosts: []

webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
  # Add TURN credentials for strict mobile carrier / enterprise symmetric NATs:
  # - url: turn:turn.zikrekidusan.com:3478
  #   username: <turn-user>
  #   password: <turn-pass>

# ─── Path Defaults ───────────────────────────────────────────────────────────
# Paths are registered dynamically per broadcast session via the REST API.
# Note: Static fallback paths are intentionally omitted so every WHIP session
# binds to a valid, freshly-activated Cloudinary RTMP stream key.
pathDefaults:
  readUser: ""
  readPass: ""
  publishUser: ""
  publishPass: ""