name: mobile
description: "ዝክረ ክዱሳን — Professional Video Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.3.1
  logger: ^2.7.0
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # F3: Video Platform
  video_player: ^2.9.5
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  path: ^1.9.0
  mime: ^2.0.0
  timeago: ^3.7.1
  path_provider: ^2.1.6

  # F4: Social & UI
  share_plus: ^10.0.0
  flutter_staggered_animations: ^1.1.1

  # F5: Live Streaming
  socket_io_client: ^2.0.3+1
  wakelock_plus: ^1.2.10
  shared_preferences: ^2.5.5

  # F6: Advanced Messaging
  just_audio: ^0.9.40
  record: 6.2.1
  file_picker: ^11.0.3
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  emoji_picker_flutter: 4.5.3
  photo_view: ^0.15.0
  chewie: ^1.8.5
  permission_handler: ^11.3.1
  open_filex: ^4.4.1
  intl: ^0.19.0
  flutter_sound: ^9.2.13
  rxdart: ^0.28.0
  scrollable_positioned_list: ^0.3.8
  visibility_detector: ^0.4.0+2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  mockito: ^5.4.4
  json_serializable: ^6.8.0

  # App icon generator
  flutter_launcher_icons: ^0.14.4

  # Native splash screen generator
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # assets:
  #   - .env
  #   - assets/images/logo.jpg
  #   - assets/images/ui.jpg
  #   - assets/images/ui2.jpg

  assets:
    - .env
    - assets/images/
    - assets/lang/
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/App_icon.jpg"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/App_icon.jpg"

  remove_alpha_ios: true


flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/App_icon.jpg"

  android_12:
    color: "#FFFFFF"
    image: "assets/images/App_icon.jpg"

  android: true
  ios: true
  web: true